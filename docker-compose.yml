services:
  mysql:
    image: mysql:8.4
    platform: ${RUN_PLATFORM:-linux/amd64}
    restart: unless-stopped
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: yes
      MYSQL_DATABASE: lbbs
      MYSQL_USER: lbbs
      MYSQL_PASSWORD: YjM2ZmRmODNmYmE
    networks:
      - app-network
    mem_limit: 512M
    command:
      - --skip-performance-schema
      - --innodb-buffer-pool-size=64M
      - --max-connections=15
    healthcheck:
      # $$ defers expansion to the container shell. Double quotes are required:
      # single quotes would keep the variables literal, making every probe fail
      # authentication (mysqladmin ping returns 0 on access denied as well, so
      # the failure would stay invisible). MYSQL_PWD avoids the client warning
      # about a password on the command line. A real query is used instead of
      # `ping` so that invalid credentials mark the service unhealthy.
      test: [ "CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u \"$$MYSQL_USER\" -e 'SELECT 1' >/dev/null" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  solr:
    image: leafok/lbbs-solr:combo
    platform: ${RUN_PLATFORM:-linux/amd64}
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile/dockerfile.solr
    volumes:
      - solr-data:/var/solr
    environment:
      SOLR_JAVA_MEM: "-Xms256m -Xmx512m"
      # The lbbs configset loads its SmartChinese analyzer through a <lib/>
      # directive; Solr refuses <lib/> unless this is enabled (otherwise the
      # core fails to start). Set here as well as in Dockerfile/dockerfile.solr
      # so that pre-built / pulled images work without a rebuild.
      SOLR_CONFIG_LIB_ENABLED: "true"
    command:
      - solr-precreate
      - lbbs
      - /opt/solr/server/solr/configsets/lbbs
    networks:
      - app-network
    mem_limit: 512M

  apache:
    image: leafok/lbbs-apache:combo
    platform: ${RUN_PLATFORM:-linux/amd64}
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile/dockerfile.apache
    ports:
      - "8080:8081"
    volumes:
      - www-data:/var/www/html
      - apache-logs:/usr/local/apache2/logs
    depends_on:
      - php
      - solr
    networks:
      - app-network

  php:
    image: leafok/lbbs-php:combo
    platform: ${RUN_PLATFORM:-linux/amd64}
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile/dockerfile.php
    volumes:
      - www-data:/var/www/html
      - php-sessions:/var/lib/php/sessions
      - apache-logs:/usr/local/apache2/logs
    depends_on:
      mysql:
        condition: service_healthy
        restart: true
    networks:
      - app-network
    expose:
      - "9000"
    command: [ "php-fpm" ]

  bbsd-prepare:
    image: leafok/lbbs-bbsd:combo
    platform: ${RUN_PLATFORM:-linux/amd64}
    restart: on-failure
    build:
      context: .
      dockerfile: Dockerfile/dockerfile.bbsd
    volumes:
      - bbsd-conf:/usr/local/lbbs/conf
      - bbsd-data:/usr/local/lbbs/data
      - bbsd-var:/usr/local/lbbs/var
      - bbsd-log:/usr/local/lbbs/log
      - bbsd-utils-conf:/usr/local/lbbs/utils/conf
    depends_on:
      mysql:
        condition: service_healthy
        restart: true
    networks:
      - app-network
    command: [ "/bin/sh", "/usr/local/lbbs/bin/bbsd_prepare.sh" ]

  bbsd:
    image: leafok/lbbs-bbsd:combo
    platform: ${RUN_PLATFORM:-linux/amd64}
    restart: unless-stopped
    shm_size: '4gb'
    ports:
      - "2322:2322"
      - "2323:2323"
    volumes:
      - bbsd-conf:/usr/local/lbbs/conf
      - bbsd-data:/usr/local/lbbs/data
      - bbsd-var:/usr/local/lbbs/var
      - bbsd-log:/usr/local/lbbs/log
      - bbsd-utils-conf:/usr/local/lbbs/utils/conf
    depends_on:
      bbsd-prepare:
        condition: service_completed_successfully
    networks:
      - app-network
    command: [ "/usr/local/lbbs/bin/bbsd", "-f" ]

networks:
  app-network:
    driver: bridge

volumes:
  mysql-data:
    # Volume for persistent storage of mysql data
    driver: local
  solr-data:
    # Volume for persistent storage of solr data
    driver: local
  www-data:
    # Volume for persistent storage of web data
    driver: local
  php-sessions:
    # Volume for persistent storage of PHP session data
    driver: local
  apache-logs:
    # Volume for persistent storage of Apache logs
    driver: local
  bbsd-conf:
    driver: local
  bbsd-data:
    driver: local
  bbsd-var:
    driver: local
  bbsd-log:
    driver: local
  bbsd-utils-conf:
    driver: local
