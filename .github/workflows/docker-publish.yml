name: Publish Docker image

on:
  push:
    tags:
      - 'combo-*'

# Each image is uploaded once per platform and merged afterwards, so cancelling halfway
# through would leave the combo tags pointing at an incomplete manifest list
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_BASE: ${{ secrets.DOCKERHUB_USERNAME }}/lbbs
  # both lists have to match the build matrix below
  IMAGES: solr apache php bbsd
  ARCHS: amd64 arm64

jobs:

  # One native runner per architecture, so the php extension and the bbsd server are
  # compiled for their own architecture instead of emulated: the emulated arm64 half of
  # the old single job was 441s for php and 605s for bbsd against 66s and 63s on amd64.
  build:

    name: ${{ matrix.image }} ${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-26.04-arm' || 'ubuntu-latest' }}

    permissions:
      contents: read
      attestations: write
      id-token: write # Required by the provenance and SBOM attestations

    strategy:
      fail-fast: false
      matrix:
        image: [solr, apache, php, bbsd]
        arch: [amd64, arm64]

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive
          # .dockerignore keeps .git out of every build context and the tag below comes
          # from the event, so neither the repository nor the submodules need history
          fetch-depth: 1

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_BASE }}-${{ matrix.image }}
          # the per-platform tag that the publish job merges into the release tags
          tags: |
            type=raw,value=${{ github.ref_name }}-${{ matrix.arch }}

      - name: Build and push the platform image
        uses: docker/build-push-action@v7
        with:
          platforms: linux/${{ matrix.arch }}
          context: .
          file: Dockerfile/dockerfile.${{ matrix.image }}
          push: true
          # min attests the exported image only; max also records every internal buildx
          # step as a subject, which for this build is the whole compile
          provenance: mode=min
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # scope keeps the eight builds from evicting each other out of one shared cache
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

  publish:

    name: Merge the manifest lists
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Merge the platform images
        run: |
          set -eu
          read -r -a images <<< "${IMAGES}"
          read -r -a archs <<< "${ARCHS}"
          for image in "${images[@]}"; do
          	args=(
          		--tag "${IMAGE_BASE}-${image}:${GITHUB_REF_NAME}"
          		--tag "${IMAGE_BASE}-${image}:combo"
          	)
          	for arch in "${archs[@]}"; do
          		args+=("${IMAGE_BASE}-${image}:${GITHUB_REF_NAME}-${arch}")
          	done
          	echo "Creating the manifest list for ${image} from: ${args[*]}"
          	# the platform manifests are copied unchanged, so the labels and the
          	# attestations pushed for their own digests stay reachable through the new tags
          	docker buildx imagetools create "${args[@]}"
          done

  # The per-architecture tags are only inputs for the merge above. Removing them keeps the
  # repository listing to what users actually pull; the merged index references the same
  # manifests by digest, so their blobs survive as long as the release tags do.
  cleanup:

    name: Remove the platform tags
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Delete the platform tags
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -eu
          read -r -a images <<< "${IMAGES}"
          read -r -a archs <<< "${ARCHS}"
          for image in "${images[@]}"; do
          	repo="${IMAGE_BASE}-${image}"
          	# nothing is deleted until the merged release tag resolves
          	docker buildx imagetools inspect --raw "${repo}:${GITHUB_REF_NAME}" > /dev/null
          	# a token without the delete permission is refused here, which is the point
          	token="$(curl -fsS -u "${DOCKERHUB_USERNAME}:${DOCKERHUB_TOKEN}" \
          		"https://auth.docker.io/token?service=registry.docker.io&scope=repository:${repo}:delete,push" |
          		jq -r .token)"
          	for arch in "${archs[@]}"; do
          		ref="${GITHUB_REF_NAME}-${arch}"
          		curl -fsS -X DELETE -o /dev/null \
          			-H "Authorization: Bearer ${token}" \
          			"https://registry-1.docker.io/v2/${repo}/manifests/${ref}"
          		echo "Deleted ${repo}:${ref}"
          	done
          done
