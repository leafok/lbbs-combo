name: Docker Image CI

on:
  push:
    branches:
      - "main"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # nothing is pushed from here, so the name only has to be valid: no secrets needed
  IMAGE_BASE: ${{ github.repository_owner }}/lbbs

jobs:

  # One job per image and architecture. arm64 runs on a native runner instead of QEMU,
  # which mattered for the php extension and the bbsd compile.
  build:

    name: ${{ matrix.image }} ${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-26.04-arm' || 'ubuntu-latest' }}

    strategy:
      fail-fast: false
      matrix:
        image: [solr, apache, php, bbsd]
        arch: [amd64, arm64]

    steps:
    - name: Checkout repository and submodules
      uses: actions/checkout@v6
      with:
        submodules: recursive
        # .dockerignore keeps .git out of every build context and the metadata below is
        # read from the event, so neither the repository nor the submodules need history
        fetch-depth: 1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.IMAGE_BASE }}-${{ matrix.image }}

    - name: Build the Docker image
      uses: docker/build-push-action@v7
      with:
        platforms: linux/${{ matrix.arch }}
        context: .
        file: Dockerfile/dockerfile.${{ matrix.image }}
        # Publishing happens in docker-publish.yml on a combo tag
        push: false
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        # scope keeps the eight builds from evicting each other out of one shared cache
        cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
        cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}
